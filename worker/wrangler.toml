# Einstellungen für den Cloudflare Worker (Zwischenhändler zu TMDB).
# Hier steht NICHTS Geheimes. Der TMDB-Schlüssel wird im Cloudflare-Dashboard
# als Secret mit dem Namen TMDB_TOKEN eingetragen.

name = "film-app-tmdb"
main = "index.js"
compatibility_date = "2026-06-01"

[vars]
# Nur diese Websites dürfen den Worker benutzen (durch Komma getrennt).
ALLOWED_ORIGINS = "https://bauer-reisen.github.io,http://localhost:5500"

# Schutz vor Missbrauch: höchstens 60 Anfragen pro Minute und Gerät
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 300
  period = 60

# Nutzungs-Zählung (anonym): Zufallsnummer je Gerät, Tag, Android/iPhone/Computer, installiert ja/nein.
# Die Statistik-Seite /stats ist mit dem Secret STATS_KEY geschützt (im Dashboard eintragen).
[[d1_databases]]
binding = "STATS"
database_name = "film-app-stats"
database_id = "9338bc9b-fcb7-4d57-b82c-3a8b60e8470d"
